    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff7a1a%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2213%22 font-family=%22Arial%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22%23090a0c%22%3EDG%3C/text%3E%3C/svg%3E" />
    <title>Вадим Гук — сайт, відео та автоматизація для бізнесу</title>
    <meta name="description" content="Технічний партнер для малого бізнесу: лендинги, магазини, вертикальні відео, Telegram-боти, AI + Trello, Meta Ads. Почнемо з конкретної задачі та погодженого кошторису." />
    <meta property="og:title" content="Сайт, відео та автоматизація — з одним технічним партнером" />
    <meta property="og:locale" content="uk_UA" />
    <link rel="preload" as="image" href="/media/lovim.webp" />
    <script>
      // режим motion до першого кадру: off (reduced / ?motion=off), lite (Instagram/FB WebView, ?motion=lite), full
      (function () {
        var q = new URLSearchParams(location.search).get("motion");
        var m = q || (matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : /Instagram|FBAN|FBAV/.test(navigator.userAgent) ? "lite" : "full");
        document.documentElement.dataset.motion = m;
      })();
    </script>
  </head>

    <!--page-->
    <script type="module" src="/src/main.ts"></script>
  </body>
